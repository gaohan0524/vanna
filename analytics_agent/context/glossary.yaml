# L2 指标与术语：提示词只渲染 short；formula/pitfalls 供 Stage 2 指标工具使用。
# 口径以 evaluation/seed/metrics.md 为准，修改时两边必须同步。

metrics:
  gmv:
    name: "GMV"
    short: "有效订单/CNY/排测试；不扣退款"
    formula: "SUM(orders.amount_cents)/100，status IN ('paid','shipped','completed')，currency='CNY'，is_test=0"
    pitfalls: "不扣退款；不含 pending/cancelled；不含 USD"
  net_revenue:
    name: "净收入"
    short: "GMV - approved 退款"
    formula: "GMV - SUM(refunds.amount_cents)/100 WHERE refunds.status='approved'"
    pitfalls: "公司级按退款发生月；品类级按订单 cohort，以订单金额为基数、按商品金额占比分摊；item_amount 只作比例"
  aov:
    name: "客单价"
    short: "GMV ÷ 有效订单数"
    formula: "GMV / count(DISTINCT orders.order_id)"
    pitfalls: "分母必须是有效订单，不是全部订单"
  payment_amount:
    name: "支付金额"
    short: "succeeded 且 is_retry=0"
    formula: "SUM(payments.amount_cents)/100 WHERE status='succeeded' AND is_retry=0"
    pitfalls: "重试流水会导致重复计"
  refund_amount:
    name: "退款金额"
    short: "approved 退款"
    formula: "SUM(refunds.amount_cents)/100 WHERE status='approved'"
    pitfalls: "退款是订单级，没有 product_id"
  repurchase_rate:
    name: "复购率"
    short: "近90天≥2笔CNY有效订单用户占比"
    formula: "countIf(orders>=2) / count(DISTINCT user_id)，仅有效订单/CNY/排测试，窗口按 orders.created_at 近90天"
    pitfalls: "仅CNY有效订单；用户维度排除注销；未限定窗口会漂移"
  conversion_rate:
    name: "支付转化率"
    short: "有效会话 converted 占比（%，排测试/软删）"
    formula: "countIf(sessions.converted = 1) / count()，sessions JOIN users WHERE is_test = 0 AND deleted_at IS NULL"
    pitfalls: "分母是有效会话，不是用户或全部会话；输出 0~100 百分比；加购→下单是 events 漏斗，不能复用本指标"
  retention_d7:
    name: "7日留存率"
    short: "注册后 D+1~D+7 自然日内有会话占比"
    formula: "uniqExactIf(user_id, toDate(started_at) >= addDays(toDate(signup_at), 1) AND toDate(started_at) < addDays(toDate(signup_at), 8)) / uniqExact(user_id)"
    pitfalls: "自然日对齐，含 D+7；cohort 必须满 7 天；排除测试与软删"
  mrr:
    name: "MRR"
    short: "active 账户 mrr 之和"
    formula: "SUM(accounts.mrr_cents)/100 WHERE status='active' AND users.is_test=0 AND users.deleted_at IS NULL"
    pitfalls: "不要按用户去重；paused/churned 不计；必须 join users 排测试与注销"

terms:
  - term: "有效订单"
    short: "paid/shipped/completed"
  - term: "首触渠道"
    short: "orders.channel"
  - term: "测试账号"
    short: "is_test=1，经营指标排除"
  - term: "软删"
    short: "users.deleted_at 非空，需排除"
  - term: "退款分摊"
    short: "按商品金额占比"
