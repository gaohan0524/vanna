  tables: ["orders"]
  metrics: ["orders"]
  source: "v1_30.yaml#C-14"
  version: 1
  reviewed: false

- id: "tool:C15-净收入环比"
  question: "本月至今的净收入，跟上月同期比增长多少？（截至今天 0 点，上月按相同自然日天数对齐）"
  paraphrases:
    - "本月净收入跟上月同期比增长多少"
    - "MTD净收入环比"
    - "本月至今净收入环比"
  tool_name: "run_sql"
  sql: |
    WITH
    this_month AS (
        SELECT
            (SELECT ifNull(SUM(amount_cents), 0) FROM shop.orders
             WHERE created_at >= toStartOfMonth(today())
               AND created_at <  toStartOfDay(now())
               AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0) AS rev,
            (SELECT ifNull(SUM(r.amount_cents), 0) FROM shop.refunds r
             JOIN shop.orders o ON o.order_id = r.order_id
             WHERE r.created_at >= toStartOfMonth(today())
               AND r.created_at <  toStartOfDay(now())
               AND r.status='approved' AND o.currency='CNY' AND o.is_test=0) AS ref
    ),
    last_month AS (
        SELECT
            (SELECT ifNull(SUM(amount_cents), 0) FROM shop.orders
             WHERE created_at >= toStartOfMonth(today() - INTERVAL 1 MONTH)
               AND created_at < least(
                   addDays(
                       toStartOfMonth(today() - INTERVAL 1 MONTH),
                       dateDiff('day', toStartOfMonth(today()), toStartOfDay(now()))
                   ),
                   toStartOfMonth(today())
               )
               AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0) AS rev,
            (SELECT ifNull(SUM(r.amount_cents), 0) FROM shop.refunds r
             JOIN shop.orders o ON o.order_id = r.order_id
             WHERE r.created_at >= toStartOfMonth(today() - INTERVAL 1 MONTH)
               AND r.created_at < least(
                   addDays(
                       toStartOfMonth(today() - INTERVAL 1 MONTH),
                       dateDiff('day', toStartOfMonth(today()), toStartOfDay(now()))
                   ),
                   toStartOfMonth(today())
               )
               AND r.status='approved' AND o.currency='CNY' AND o.is_test=0) AS ref
    )
    SELECT
        round(
            ((this_month.rev - this_month.ref) - (last_month.rev - last_month.ref))
            / nullIf((last_month.rev - last_month.ref), 0) * 100,
            2
        ) AS net_mom_pct
    FROM this_month, last_month
  tables: ["orders", "refunds"]
  metrics: ["net_revenue"]
  source: "v1_30.yaml#C-15"
  version: 1
  reviewed: false

- id: "tool:C16-月新增用户环比"
  question: "近 12 个完整月（不含本月）每月新增用户数及环比是多少？（首月无环比）"
  paraphrases:
    - "近12个完整月每月新增用户数及环比"
    - "过去一年每月拉新和环比"
    - "过去12个完整月每月新增用户及环比"
  tool_name: "run_sql"
  sql: |
    WITH
        months AS (
            SELECT toStartOfMonth(today()) - toIntervalMonth(number + 1) AS month
            FROM numbers(12)
        ),
        counts AS (
            SELECT toStartOfMonth(signup_at) AS month, count() AS new_users
            FROM shop.users
            WHERE signup_at >= toStartOfMonth(today()) - INTERVAL 12 MONTH
              AND signup_at <  toStartOfMonth(today())
              AND is_test = 0 AND deleted_at IS NULL
            GROUP BY month
        )
    SELECT m.month AS month,
           ifNull(c.new_users, 0) AS new_users,
           round(
               (ifNull(c.new_users, 0) - ifNull(p.new_users, 0))
               / nullIf(ifNull(p.new_users, 0), 0) * 100,
               2
           ) AS mom_pct
    FROM months m
    LEFT JOIN counts c ON c.month = m.month
    LEFT JOIN counts p ON p.month = m.month - toIntervalMonth(1)
    ORDER BY m.month
  tables: ["users"]
  metrics: ["new_users"]
  source: "v1_30.yaml#C-16"
  version: 1
  reviewed: false

- id: "tool:D04-上周支付转化率"
  question: "上周各渠道的支付转化率是多少？（排除测试与注销用户）"
  paraphrases:
    - "上周各渠道支付转化率"
    - "上一个完整周各渠道转化率"
    - "上一个完整周各渠道支付转化率"
  tool_name: "run_sql"
  sql: |
    SELECT channel,
           round(100.0 * countIf(converted = 1) / nullIf(count(), 0), 2) AS cvr_pct
    FROM shop.sessions
    WHERE started_at >= toStartOfWeek(today(), 1) - toIntervalDay(7)
      AND started_at <  toStartOfWeek(today(), 1)
      AND user_id IN (
          SELECT user_id FROM shop.users
          WHERE is_test = 0 AND deleted_at IS NULL
      )
    GROUP BY channel
    ORDER BY cvr_pct DESC, channel ASC
  tables: ["sessions", "users"]
  metrics: ["conversion_rate"]
  source: "v1_30.yaml#D-04"
  version: 1
  reviewed: false

- id: "tool:D17-七日留存"
  question: "近 3 个完整月（不含本月）每月注册用户的 7 日留存率（注册次日起 7 个自然日内有会话）是多少？"
  paraphrases:
    - "近3个完整月每月7日留存率"
    - "过去三个月注册用户7日留存"
    - "近三个月每个月的7日留存率"
  tool_name: "run_sql"
  sql: |
    WITH cohorts AS (
        SELECT user_id,
               toStartOfMonth(signup_at) AS cohort_month,
               toDate(signup_at) AS signup_date
        FROM shop.users
        WHERE is_test = 0 AND deleted_at IS NULL
          AND signup_at >= toStartOfMonth(today()) - toIntervalMonth(3)
          AND signup_at < toStartOfMonth(today())
    ),
    retained AS (
        SELECT DISTINCT c.user_id
        FROM cohorts c
        INNER JOIN shop.sessions s ON s.user_id = c.user_id
        WHERE toDate(s.started_at) >= addDays(c.signup_date, 1)
          AND toDate(s.started_at) < addDays(c.signup_date, 8)
    )
    SELECT c.cohort_month,
           count() AS new_users,
           round(100.0 * countIf(r.user_id > 0) / nullIf(count(), 0), 2)
               AS retention_7d_pct
    FROM cohorts c
    LEFT JOIN retained r ON r.user_id = c.user_id
    GROUP BY c.cohort_month
    ORDER BY c.cohort_month ASC
  tables: ["users", "sessions"]
  metrics: ["retention_d7"]
  source: "v1_30.yaml#D-17"
  version: 1
  reviewed: false

- id: "tool:D18-加购下单率"
  question: "近 7 天加购后最终下单的会话比例是多少？（同一会话内，purchase 事件需晚于 add_to_cart；排除测试与注销用户）"
  paraphrases:
    - "近7天加购后下单的会话比例"
    - "加购后最终购买的会话占比"
    - "最近7天加购后购买转化率"
  tool_name: "run_sql"
  sql: |
    SELECT countIf(has_cart = 1) AS cart_sessions,
           countIf(has_cart = 1 AND has_purchase = 1 AND is_ordered = 1)
               AS cart_then_purchase_sessions,
           round(
               100.0 * countIf(has_cart = 1 AND has_purchase = 1 AND is_ordered = 1)
               / nullIf(countIf(has_cart = 1), 0),
               2
           ) AS cvr_pct
    FROM (
        SELECT session_id,
               max(event_name = 'add_to_cart') AS has_cart,
               max(event_name = 'purchase') AS has_purchase,
               minIf(event_time, event_name = 'add_to_cart') AS cart_time,
               minIf(event_time, event_name = 'purchase') AS purchase_time,
               purchase_time >= cart_time AS is_ordered
        FROM shop.events
        WHERE event_time >= toStartOfDay(now()) - toIntervalDay(7)
          AND event_time <  toStartOfDay(now())
          AND event_name IN ('add_to_cart', 'purchase')
          AND user_id IN (
              SELECT user_id FROM shop.users
              WHERE is_test = 0 AND deleted_at IS NULL
          )
        GROUP BY session_id
    )
  tables: ["events", "users"]
  metrics: ["cart_to_order_rate"]
  source: "v1_30.yaml#D-18"
  version: 1
  reviewed: false

- id: "tool:H26-每日购买事件"
  question: "近 7 天每天的 purchase 事件数是多少？"
  paraphrases:
    - "近7天每天purchase事件数"
    - "过去一周每日购买事件量"
    - "最近7天每日purchase事件数量"
  tool_name: "run_sql"
  sql: |
    SELECT toDate(event_time) AS day, count() AS purchase_events
    FROM shop.events
    WHERE event_name = 'purchase'
      AND user_id NOT IN (SELECT user_id FROM shop.users WHERE is_test = 1)
      AND event_time >= toStartOfDay(now()) - INTERVAL 7 DAY
      AND event_time <  toStartOfDay(now())
    GROUP BY day
    ORDER BY day
  tables: ["events", "users"]
  metrics: ["purchase_events"]
  source: "v1_30.yaml#H-26"
  version: 1
  reviewed: false

