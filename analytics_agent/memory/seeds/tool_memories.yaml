- id: "tool:I29-organic-GMV"
  question: "近 30 天 organic 渠道的 GMV 是多少？"
  paraphrases:
    - "只看organic的GMV"
    - "organic渠道近30天GMV"
    - "organic渠道最近30天GMV是多少"
