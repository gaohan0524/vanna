# 主评测集（v1）：先放入 6 条完整样例，其余按 6.1 分层矩阵补到 30 条。
# 分层配额（30）：A 4 / B 5 / C 4 / D 3 / E 4 / F 2 / G 3 / H 2 / I 3
# 出题纪律：先写 golden SQL 并在 ClickHouse 上跑通、看懂结果，再录入 YAML。
#   python -m analytics_agent.evaluation.cli check --dataset analytics_agent/evaluation/datasets/v1_30.yaml
#   python -m analytics_agent.evaluation.cli run   --dataset analytics_agent/evaluation/datasets/v1_30.yaml

dataset:
  name: "shop_v1_30"
  description: "自建 ClickHouse 合成业务库评测集 v1"
  test_cases:
    - id: "A-01"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "最近 30 天各渠道的 GMV 是多少？"
      metadata:
        layer: A
        difficulty: easy
        golden_sql: |
          SELECT channel, SUM(amount_cents) / 100.0 AS gmv
          FROM shop.orders
          WHERE created_at >= now() - INTERVAL 30 DAY
            AND status IN ('paid','shipped','completed')
            AND currency = 'CNY' AND is_test = 0
          GROUP BY channel
          ORDER BY gmv DESC
        expected_behavior: answer

    - id: "B-02"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "按品类看最近一个月的净收入"
      metadata:
        layer: B
        difficulty: medium
        golden_sql: |
          SELECT p.category,
                 (SUM(oi.item_amount_cents) - SUM(ifNull(r.amount_cents, 0))) / 100.0 AS net_revenue
          FROM shop.order_items oi
          JOIN shop.orders o ON o.order_id = oi.order_id
          JOIN shop.products p ON p.product_id = oi.product_id
          LEFT JOIN (
              SELECT order_id, SUM(amount_cents) AS amount_cents
              FROM shop.refunds
              WHERE status = 'approved'
              GROUP BY order_id
          ) r ON r.order_id = o.order_id
          WHERE o.created_at >= now() - INTERVAL 30 DAY
            AND o.status IN ('paid','shipped','completed')
            AND o.currency = 'CNY' AND o.is_test = 0
          GROUP BY p.category
          ORDER BY net_revenue DESC
        expected_behavior: answer

    - id: "C-03"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "本月 GMV 跟上月比增长了多少？"
      metadata:
        layer: C
        difficulty: medium
        order_sensitive: false
        golden_sql: |
          WITH
            cur AS (
              SELECT SUM(amount_cents) AS v FROM shop.orders
              WHERE toStartOfMonth(created_at) = toStartOfMonth(today())
                AND status IN ('paid','shipped','completed')
                AND currency = 'CNY' AND is_test = 0
            ),
            prev AS (
              SELECT SUM(amount_cents) AS v FROM shop.orders
              WHERE toStartOfMonth(created_at) = toStartOfMonth(today() - INTERVAL 1 MONTH)
                AND status IN ('paid','shipped','completed')
                AND currency = 'CNY' AND is_test = 0
            )
          SELECT round(
              (toFloat64(cur.v) - toFloat64(prev.v)) / toFloat64(prev.v) * 100,
              2
          ) AS mom_pct
          FROM cur, prev
        expected_behavior: answer

    - id: "D-04"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "上周各渠道的支付转化率"
      metadata:
        layer: D
        difficulty: medium
        golden_sql: |
          SELECT channel, countIf(converted = 1) / count() AS cvr
          FROM shop.sessions
          WHERE started_at >= toStartOfWeek(today()) - INTERVAL 7 DAY
            AND started_at <  toStartOfWeek(today())
          GROUP BY channel
          ORDER BY cvr DESC
        expected_behavior: answer

    - id: "E-05"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "看一下复购率"
      metadata:
        layer: E
        difficulty: easy
        expected_behavior: clarify

    - id: "F-06"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "帮我查一下竞品的市场份额"
      metadata:
        layer: F
        difficulty: easy
        expected_behavior: refuse
