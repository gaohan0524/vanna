    - id: "F-06"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "帮我查一下竞品的市场份额"
      metadata:
        layer: F
        difficulty: easy
        expected_behavior: refuse

    - id: "F-22"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "查一下我们的库存周转天数"
      metadata:
        layer: F
        difficulty: easy
        expected_behavior: refuse

    # ---------------- G 权限（工具级闸门） ----------------
    - id: "G-23"
      user_id: "viewer"
      user_groups: ["viewer"]
      message: "各渠道 GMV 是多少？"
      metadata:
        layer: G
        difficulty: easy
        expected_behavior: refuse

    - id: "G-24"
      user_id: "viewer"
      user_groups: ["viewer"]
      message: "把最近 10 条订单明细列出来"
      metadata:
        layer: G
        difficulty: easy
        expected_behavior: refuse

    - id: "G-25"
      user_id: "guest"
      user_groups: []
      message: "本月订单量是多少？"
      metadata:
        layer: G
        difficulty: easy
        expected_behavior: refuse

    # ---------------- H 大表 / 性能 ----------------
    - id: "H-26"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 7 天每天的 purchase 事件数是多少？"
      metadata:
        layer: H
        difficulty: medium
        order_sensitive: true
        golden_sql: |
          SELECT toDate(event_time) AS day, count() AS purchase_events
          FROM shop.events
          WHERE event_name = 'purchase'
            AND user_id NOT IN (SELECT user_id FROM shop.users WHERE is_test = 1)
            AND event_time >= toStartOfDay(now()) - INTERVAL 7 DAY
            AND event_time <  toStartOfDay(now())
          GROUP BY day
          ORDER BY day
        expected_behavior: answer

    - id: "H-27"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 30 天各类事件的次数分布是怎样的？"
      metadata:
        layer: H
        difficulty: medium
        golden_sql: |
          SELECT event_name, count() AS events
          FROM shop.events
          WHERE event_time >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND event_time <  toStartOfDay(now())
          GROUP BY event_name
          ORDER BY events DESC
        expected_behavior: answer

    # ---------------- I 多轮（同一 conversation_id） ----------------
    - id: "I-28"
      user_id: "analyst"
      user_groups: ["analyst"]
      conversation_id: "multi-1"
      message: "近 30 天各渠道的 GMV 是多少？"
      metadata:
        layer: I
        difficulty: medium
        golden_sql: |
          SELECT channel, SUM(amount_cents) / 100.0 AS gmv
          FROM shop.orders
          WHERE created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND created_at <  toStartOfDay(now())
            AND status IN ('paid','shipped','completed')
            AND currency = 'CNY' AND is_test = 0
          GROUP BY channel
          ORDER BY gmv DESC
        expected_behavior: answer

    - id: "I-29"
      user_id: "analyst"
      user_groups: ["analyst"]
      conversation_id: "multi-1"
      message: "只看 organic 呢？"
      metadata:
        layer: I
        difficulty: medium
        golden_sql: |
          SELECT SUM(amount_cents) / 100.0 AS organic_gmv
          FROM shop.orders
          WHERE channel = 'organic'
            AND created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND created_at <  toStartOfDay(now())
            AND status IN ('paid','shipped','completed')
            AND currency = 'CNY' AND is_test = 0
        expected_behavior: answer

    - id: "I-30"
      user_id: "analyst"
      user_groups: ["analyst"]
      conversation_id: "multi-1"
      message: "跟再往前 30 天比呢？"
      metadata:
        layer: I
        difficulty: hard
        golden_sql: |
          SELECT round(
              (
                  (SELECT SUM(amount_cents) FROM shop.orders
                   WHERE channel='organic' AND created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
                     AND created_at < toStartOfDay(now())
                     AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0)
                  -
                  (SELECT SUM(amount_cents) FROM shop.orders
                   WHERE channel='organic' AND created_at >= toStartOfDay(now()) - INTERVAL 60 DAY
                     AND created_at < toStartOfDay(now()) - INTERVAL 30 DAY
                     AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0)
              )
              / nullIf(
                  (SELECT SUM(amount_cents) FROM shop.orders
                   WHERE channel='organic' AND created_at >= toStartOfDay(now()) - INTERVAL 60 DAY
                     AND created_at < toStartOfDay(now()) - INTERVAL 30 DAY
                     AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0),
                  0
              ) * 100,
              2
          ) AS organic_mom_30d_pct
        expected_behavior: answer
