# 主评测集 v1：30 条，覆盖 A~I 九层。
# 口径以 analytics_agent/evaluation/seed/metrics.md 为准（2026-10-22 已裁决 5 项）。
# 分层配额：A 4 / B 5 / C 4 / D 3 / E 4 / F 2 / G 3 / H 2 / I 3
#
#   python -m analytics_agent.evaluation.cli check --strict --dataset analytics_agent/evaluation/datasets/v1_30.yaml
#   python -m analytics_agent.evaluation.cli run --dataset analytics_agent/evaluation/datasets/v1_30.yaml

dataset:
  name: "shop_v1_30"
  description: "自建 ClickHouse 合成业务库评测集 v1（30 条）"
  test_cases:
    # ---------------- A 单表聚合 ----------------
    - id: "A-01"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "最近 30 天各渠道的 GMV 是多少？"
      metadata:
        layer: A
        difficulty: easy
        golden_sql: |
          SELECT channel, SUM(amount_cents) / 100.0 AS gmv
          FROM shop.orders
          WHERE created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND created_at <  toStartOfDay(now())
            AND status IN ('paid','shipped','completed')
            AND currency = 'CNY' AND is_test = 0
          GROUP BY channel
          ORDER BY gmv DESC
        without_filter_sql: |
          SELECT channel, SUM(amount_cents) / 100.0 AS gmv
          FROM shop.orders
          WHERE created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND created_at <  toStartOfDay(now())
          GROUP BY channel
          ORDER BY gmv DESC
        expected_behavior: answer

    - id: "A-07"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 30 天各支付方式的成功支付金额分别是多少？"
      metadata:
        layer: A
        difficulty: easy
        golden_sql: |
          SELECT p.method AS method, SUM(p.amount_cents) / 100.0 AS paid_amount
          FROM shop.payments p
          JOIN shop.orders o ON o.order_id = p.order_id
          WHERE p.status = 'succeeded' AND p.is_retry = 0
            AND o.currency = 'CNY' AND o.is_test = 0
            AND p.paid_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND p.paid_at <  toStartOfDay(now())
          GROUP BY p.method
          ORDER BY paid_amount DESC
        without_filter_sql: |
          SELECT method, SUM(amount_cents) / 100.0 AS paid_amount
          FROM shop.payments
          WHERE status = 'succeeded'
          GROUP BY method
          ORDER BY paid_amount DESC
        expected_behavior: answer

    - id: "A-08"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 7 天各渠道新增用户数是多少？"
      metadata:
        layer: A
        difficulty: easy
        golden_sql: |
          SELECT channel, count() AS new_users
          FROM shop.users
          WHERE signup_at >= toStartOfDay(now()) - INTERVAL 7 DAY
            AND signup_at <  toStartOfDay(now())
            AND is_test = 0 AND deleted_at IS NULL
          GROUP BY channel
          ORDER BY new_users DESC
        expected_behavior: answer

    - id: "A-09"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "当前各套餐的 MRR 是多少？（排除测试与注销用户）"
      metadata:
        layer: A
        difficulty: easy
        golden_sql: |
          SELECT a.plan AS plan, SUM(a.mrr_cents) / 100.0 AS mrr
          FROM shop.accounts a
          JOIN shop.users u ON u.user_id = a.user_id
          WHERE a.status = 'active' AND u.is_test = 0 AND u.deleted_at IS NULL
          GROUP BY a.plan
          ORDER BY mrr DESC
        without_filter_sql: |
          SELECT plan, SUM(mrr_cents) / 100.0 AS mrr
          FROM shop.accounts
          GROUP BY plan
          ORDER BY mrr DESC
        expected_behavior: answer

    # ---------------- B 多表 join ----------------
    - id: "B-02"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 30 天各品类的净收入是多少？"
      metadata:
        layer: B
        difficulty: medium
        golden_sql: |
          WITH order_item_sum AS (
              SELECT order_id, SUM(item_amount_cents) AS total_order_item_amount
              FROM shop.order_items
              GROUP BY order_id
          ),
          order_refund_sum AS (
              SELECT order_id, SUM(amount_cents) AS total_refund_amount
              FROM shop.refunds
              WHERE status = 'approved'
              GROUP BY order_id
          )
          SELECT
              p.category,
              round(
                  SUM(
                      oi.item_amount_cents -
                      (
                          ifNull(r.total_refund_amount, 0)
                          * (oi.item_amount_cents / NULLIF(ois.total_order_item_amount, 0))
                      )
                  ) / 100.0,
                  2
              ) AS net_revenue
          FROM shop.order_items oi
          JOIN shop.orders o ON o.order_id = oi.order_id
          JOIN shop.products p ON p.product_id = oi.product_id
          JOIN order_item_sum ois ON ois.order_id = oi.order_id
          LEFT JOIN order_refund_sum r ON r.order_id = o.order_id
          WHERE o.created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND o.created_at <  toStartOfDay(now())
            AND o.status IN ('paid','shipped','completed')
            AND o.currency = 'CNY'
            AND o.is_test = 0
          GROUP BY p.category
          ORDER BY net_revenue DESC
        expected_behavior: answer

    - id: "B-05"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "看一下近 90 天复购率"
      metadata:
        layer: B
        difficulty: easy
        golden_sql: |
          SELECT round(100.0 * countIf(cnt >= 2) / nullIf(count(), 0), 2)
                     AS repeat_rate_pct
          FROM (
              SELECT o.user_id, count() AS cnt
              FROM shop.orders o
              JOIN shop.users u ON u.user_id = o.user_id
              WHERE o.status IN ('paid','shipped','completed')
                AND o.currency = 'CNY' AND o.is_test = 0
                AND u.deleted_at IS NULL
                AND o.created_at >= toStartOfDay(now()) - INTERVAL 90 DAY
                AND o.created_at <  toStartOfDay(now())
              GROUP BY o.user_id
          )
        expected_behavior: answer

    - id: "B-10"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 90 天各渠道的退款金额是多少？"
      metadata:
        layer: B
        difficulty: medium
        golden_sql: |
          SELECT o.channel, SUM(r.amount_cents) / 100.0 AS refund_amount
          FROM shop.refunds r
          JOIN shop.orders o ON o.order_id = r.order_id
          WHERE r.status = 'approved'
            AND r.created_at >= toStartOfDay(now()) - INTERVAL 90 DAY
            AND r.created_at <  toStartOfDay(now())
            AND o.currency = 'CNY' AND o.is_test = 0
          GROUP BY o.channel
          ORDER BY refund_amount DESC
        without_filter_sql: |
          SELECT o.channel, SUM(r.amount_cents) / 100.0 AS refund_amount
          FROM shop.refunds r
          JOIN shop.orders o ON o.order_id = r.order_id
          WHERE r.created_at >= toStartOfDay(now()) - INTERVAL 90 DAY
            AND r.created_at <  toStartOfDay(now())
            AND o.currency = 'CNY' AND o.is_test = 0
          GROUP BY o.channel
          ORDER BY refund_amount DESC
        expected_behavior: answer

    - id: "B-11"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 30 天销量最高的 10 个商品是哪些？"
      metadata:
        layer: B
        difficulty: medium
        golden_sql: |
          SELECT p.name AS product, SUM(oi.quantity) AS units
          FROM shop.order_items oi
          JOIN shop.orders o ON o.order_id = oi.order_id
          JOIN shop.products p ON p.product_id = oi.product_id
          WHERE o.status IN ('paid','shipped','completed')
            AND o.currency = 'CNY' AND o.is_test = 0
            AND o.created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND o.created_at <  toStartOfDay(now())
          GROUP BY p.name, p.product_id
          ORDER BY units DESC, p.product_id
          LIMIT 10
        expected_behavior: answer

    - id: "B-12"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 30 天各国家用户的支付转化率是多少？"
      metadata:
        layer: B
        difficulty: medium
        golden_sql: |
          SELECT u.country, round(100.0 * countIf(s.converted = 1) / count(), 2) AS cvr_pct
          FROM shop.sessions s
          JOIN shop.users u ON u.user_id = s.user_id
          WHERE u.is_test = 0 AND u.deleted_at IS NULL
            AND s.started_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND s.started_at <  toStartOfDay(now())
          GROUP BY u.country
          ORDER BY cvr_pct DESC
        expected_behavior: answer

    - id: "B-13"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 30 天各品类的客单价（该品类收入 ÷ 含该品类商品的订单数）是多少？"
      metadata:
        layer: B
        difficulty: hard
        golden_sql: |
          SELECT p.category,
                 round(SUM(oi.item_amount_cents) / 100.0 / count(DISTINCT o.order_id), 2) AS aov
          FROM shop.order_items oi
          JOIN shop.orders o ON o.order_id = oi.order_id
          JOIN shop.products p ON p.product_id = oi.product_id
          WHERE o.status IN ('paid','shipped','completed')
            AND o.currency = 'CNY' AND o.is_test = 0
            AND o.created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND o.created_at <  toStartOfDay(now())
          GROUP BY p.category
          ORDER BY aov DESC
        without_filter_sql: |
          SELECT p.category,
                 round(SUM(oi.item_amount_cents) / 100.0 / count(DISTINCT o.order_id), 2) AS aov
          FROM shop.order_items oi
          JOIN shop.orders o ON o.order_id = oi.order_id
          JOIN shop.products p ON p.product_id = oi.product_id
          WHERE o.currency = 'CNY' AND o.is_test = 0
            AND o.created_at >= toStartOfDay(now()) - INTERVAL 30 DAY
            AND o.created_at <  toStartOfDay(now())
          GROUP BY p.category
          ORDER BY aov DESC
        expected_behavior: answer

    # ---------------- C 时间窗口 / 同环比 ----------------
    - id: "C-03"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "本月至今的 GMV，跟上月同期比增长了多少？（截至今天 0 点，上月按相同自然日天数对齐）"
      metadata:
        layer: C
        difficulty: medium
        order_sensitive: false
        golden_sql: |
          WITH
            cur AS (
              SELECT SUM(amount_cents) AS v FROM shop.orders
              WHERE created_at >= toStartOfMonth(today())
                AND created_at <  toStartOfDay(now())
                AND status IN ('paid','shipped','completed')
                AND currency = 'CNY' AND is_test = 0
            ),
            prev AS (
              SELECT SUM(amount_cents) AS v FROM shop.orders
              WHERE created_at >= toStartOfMonth(today() - INTERVAL 1 MONTH)
                AND created_at < least(
                    addDays(
                        toStartOfMonth(today() - INTERVAL 1 MONTH),
                        dateDiff('day', toStartOfMonth(today()), toStartOfDay(now()))
                    ),
                    toStartOfMonth(today())
                )
                AND status IN ('paid','shipped','completed')
                AND currency = 'CNY' AND is_test = 0
            )
          SELECT round(
              (toFloat64(cur.v) - toFloat64(prev.v)) / toFloat64(prev.v) * 100,
              2
          ) AS mom_pct
          FROM cur, prev
        expected_behavior: answer

    - id: "C-14"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 4 周每周的有效订单数（仅 CNY）是多少？"
      metadata:
        layer: C
        difficulty: medium
        order_sensitive: true
        golden_sql: |
          SELECT toStartOfWeek(created_at, 1) AS week_start, count() AS orders
          FROM shop.orders
          WHERE created_at >= toStartOfWeek(today(), 1) - INTERVAL 4 WEEK
            AND created_at < toStartOfWeek(today(), 1)
            AND status IN ('paid','shipped','completed')
            AND currency = 'CNY' AND is_test = 0
          GROUP BY week_start
          ORDER BY week_start
        expected_behavior: answer

    - id: "C-15"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "本月至今的净收入，跟上月同期比增长多少？（截至今天 0 点，上月按相同自然日天数对齐）"
      metadata:
        layer: C
        difficulty: hard
        golden_sql: |
          WITH
          this_month AS (
              SELECT
                  (SELECT ifNull(SUM(amount_cents), 0) FROM shop.orders
                   WHERE created_at >= toStartOfMonth(today())
                     AND created_at <  toStartOfDay(now())
                     AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0) AS rev,
                  (SELECT ifNull(SUM(r.amount_cents), 0) FROM shop.refunds r
                   JOIN shop.orders o ON o.order_id = r.order_id
                   WHERE r.created_at >= toStartOfMonth(today())
                     AND r.created_at <  toStartOfDay(now())
                     AND r.status='approved' AND o.currency='CNY' AND o.is_test=0) AS ref
          ),
          last_month AS (
              SELECT
                  (SELECT ifNull(SUM(amount_cents), 0) FROM shop.orders
                   WHERE created_at >= toStartOfMonth(today() - INTERVAL 1 MONTH)
                     AND created_at < least(
                         addDays(
                             toStartOfMonth(today() - INTERVAL 1 MONTH),
                             dateDiff('day', toStartOfMonth(today()), toStartOfDay(now()))
                         ),
                         toStartOfMonth(today())
                     )
                     AND status IN ('paid','shipped','completed') AND currency='CNY' AND is_test=0) AS rev,
                  (SELECT ifNull(SUM(r.amount_cents), 0) FROM shop.refunds r
                   JOIN shop.orders o ON o.order_id = r.order_id
                   WHERE r.created_at >= toStartOfMonth(today() - INTERVAL 1 MONTH)
                     AND r.created_at < least(
                         addDays(
                             toStartOfMonth(today() - INTERVAL 1 MONTH),
                             dateDiff('day', toStartOfMonth(today()), toStartOfDay(now()))
                         ),
                         toStartOfMonth(today())
                     )
                     AND r.status='approved' AND o.currency='CNY' AND o.is_test=0) AS ref
          )
          SELECT
              round(
                  ((this_month.rev - this_month.ref) - (last_month.rev - last_month.ref))
                  / nullIf((last_month.rev - last_month.ref), 0) * 100,
                  2
              ) AS net_mom_pct
          FROM this_month, last_month
        expected_behavior: answer

    - id: "C-16"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 12 个完整月（不含本月）每月新增用户数及环比是多少？（首月无环比）"
      metadata:
        layer: C
        difficulty: hard
        order_sensitive: true
        golden_sql: |
          WITH
              months AS (
                  SELECT toStartOfMonth(today()) - toIntervalMonth(number + 1) AS month
                  FROM numbers(12)
              ),
              counts AS (
                  SELECT toStartOfMonth(signup_at) AS month, count() AS new_users
                  FROM shop.users
                  WHERE signup_at >= toStartOfMonth(today()) - INTERVAL 12 MONTH
                    AND signup_at <  toStartOfMonth(today())
                    AND is_test = 0 AND deleted_at IS NULL
                  GROUP BY month
              )
          SELECT m.month AS month,
                 ifNull(c.new_users, 0) AS new_users,
                 round(
                     (ifNull(c.new_users, 0) - ifNull(p.new_users, 0))
                     / nullIf(ifNull(p.new_users, 0), 0) * 100,
                     2
                 ) AS mom_pct
          FROM months m
          LEFT JOIN counts c ON c.month = m.month
          LEFT JOIN counts p ON p.month = m.month - toIntervalMonth(1)
          ORDER BY m.month
        expected_behavior: answer

    # ---------------- D 留存 / 漏斗 ----------------
    - id: "D-04"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "上周各渠道的支付转化率是多少？（排除测试与注销用户）"
      metadata:
        layer: D
        difficulty: medium
        golden_sql: |
          SELECT channel,
                 round(100.0 * countIf(converted = 1) / nullIf(count(), 0), 2) AS cvr_pct
          FROM shop.sessions
          WHERE started_at >= toStartOfWeek(today(), 1) - toIntervalDay(7)
            AND started_at <  toStartOfWeek(today(), 1)
            AND user_id IN (
                SELECT user_id FROM shop.users
                WHERE is_test = 0 AND deleted_at IS NULL
            )
          GROUP BY channel
          ORDER BY cvr_pct DESC, channel ASC
        expected_behavior: answer

    - id: "D-17"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 3 个完整月（不含本月）每月注册用户的 7 日留存率（注册次日起 7 个自然日内有会话）是多少？"
      metadata:
        layer: D
        difficulty: hard
        order_sensitive: true
        golden_sql: |
          WITH cohorts AS (
              SELECT user_id,
                     toStartOfMonth(signup_at) AS cohort_month,
                     toDate(signup_at) AS signup_date
              FROM shop.users
              WHERE is_test = 0 AND deleted_at IS NULL
                AND signup_at >= toStartOfMonth(today()) - toIntervalMonth(3)
                AND signup_at < toStartOfMonth(today())
          ),
          retained AS (
              SELECT DISTINCT c.user_id
              FROM cohorts c
              INNER JOIN shop.sessions s ON s.user_id = c.user_id
              WHERE toDate(s.started_at) >= addDays(c.signup_date, 1)
                AND toDate(s.started_at) < addDays(c.signup_date, 8)
          )
          SELECT c.cohort_month,
                 count() AS new_users,
                 round(100.0 * countIf(r.user_id > 0) / nullIf(count(), 0), 2)
                     AS retention_7d_pct
          FROM cohorts c
          LEFT JOIN retained r ON r.user_id = c.user_id
          GROUP BY c.cohort_month
          ORDER BY c.cohort_month ASC
        expected_behavior: answer

    - id: "D-18"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "近 7 天加购后最终下单的会话比例是多少？（同一会话内，purchase 事件需晚于 add_to_cart；排除测试与注销用户）"
      metadata:
        layer: D
        difficulty: hard
        golden_sql: |
          SELECT countIf(has_cart = 1) AS cart_sessions,
                 countIf(has_cart = 1 AND has_purchase = 1 AND is_ordered = 1)
                     AS cart_then_purchase_sessions,
                 round(
                     100.0 * countIf(has_cart = 1 AND has_purchase = 1 AND is_ordered = 1)
                     / nullIf(countIf(has_cart = 1), 0),
                     2
                 ) AS cvr_pct
          FROM (
              SELECT session_id,
                     max(event_name = 'add_to_cart') AS has_cart,
                     max(event_name = 'purchase') AS has_purchase,
                     minIf(event_time, event_name = 'add_to_cart') AS cart_time,
                     minIf(event_time, event_name = 'purchase') AS purchase_time,
                     purchase_time >= cart_time AS is_ordered
              FROM shop.events
              WHERE event_time >= toStartOfDay(now()) - toIntervalDay(7)
                AND event_time <  toStartOfDay(now())
                AND event_name IN ('add_to_cart', 'purchase')
                AND user_id IN (
                    SELECT user_id FROM shop.users
                    WHERE is_test = 0 AND deleted_at IS NULL
                )
              GROUP BY session_id
          )
        expected_behavior: answer

    # ---------------- E 口径歧义（应澄清） ----------------
    - id: "E-19"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "看一下销售额"
      metadata:
        layer: E
        difficulty: easy
        expected_behavior: clarify

    - id: "E-20"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "算下留存"
      metadata:
        layer: E
        difficulty: easy
        expected_behavior: clarify

    - id: "E-21"
      user_id: "analyst"
      user_groups: ["analyst"]
      message: "最近的转化率怎么样"
      metadata:
        layer: E
        difficulty: easy
        expected_behavior: clarify

